spring:
  application:
    name: securehandoff

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/securehandoff?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # dev convenience; use Flyway/Liquibase + "validate" in production
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # Producer/consumer serialization is configured explicitly in KafkaConfig.java

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}                  # required, at least 32 characters
    access-token-expiry-ms: 3600000        # 1 hour
  encryption:
    # Base64 of exactly 32 random bytes:  openssl rand -base64 32   (required)
    # In production pull this from a KMS / secrets manager.
    packet-secret: ${PACKET_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
