spring:
  application:
    name: securehandoff

  datasource:
    url: jdbc:mysql://localhost:3306/securehandoff?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # Producer/consumer serialization is configured explicitly in KafkaConfig.java
    # for type-safety rather than relying on Boot's generic auto-configuration.

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
    access-token-expiry-ms: 3600000        # 1 hour
    refresh-token-expiry-ms: 604800000     # 7 days
  encryption:
    # AES key for packet encryption at rest. In production, pull from a KMS/secrets manager, never hardcode.
    packet-secret: ${PACKET_SECRET:change-this-32-byte-secret-key!!}
