spring:
  application:
    name: securehandoff

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}

app:
  mail:
    api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 3600000
  encryption:
    packet-secret: ${PACKET_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false